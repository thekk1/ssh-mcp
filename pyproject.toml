[project]
name = "ssh-mcp"
version = "0.1.0"
description = "Per-user SSH command execution MCP for LibreChat -- personal key per user, no shared account, no host/command filtering"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.29,<2",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "asyncssh>=2.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
ssh-mcp = "ssh_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssh_mcp"]
